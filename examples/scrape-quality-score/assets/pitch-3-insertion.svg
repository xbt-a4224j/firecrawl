<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1140" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowSoft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .title { font-weight: 700; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="920" height="1140" fill="#f5f7fa"/>

  <!-- ============ TITLE ============ -->
  <text x="460" y="50" text-anchor="middle" class="title" font-size="28" fill="#1a2330">The fix is a joint at a seam that already exists</text>
  <text x="460" y="82" text-anchor="middle" font-size="16" fill="#5b6776">Additive — it upgrades a check the pipeline already makes.</text>

  <!-- ============ ZONE 1 : THE SEAM ============ -->
  <text x="460" y="124" text-anchor="middle" class="title" font-size="14" letter-spacing="1.5" fill="#8a96a4">THE SEAM ALREADY EXISTS</text>

  <!-- code editor box -->
  <g filter="url(#shadowSoft)">
    <rect x="110" y="140" width="700" height="186" rx="10" fill="#0d1117"/>
  </g>
  <!-- title bar -->
  <rect x="110" y="140" width="700" height="34" rx="10" fill="#161b22"/>
  <rect x="110" y="158" width="700" height="16" fill="#161b22"/>
  <!-- traffic lights -->
  <circle cx="130" cy="157" r="5.5" fill="#ff5f56"/>
  <circle cx="148" cy="157" r="5.5" fill="#ffbd2e"/>
  <circle cx="166" cy="157" r="5.5" fill="#27c93f"/>
  <text x="460" y="161" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">apps/api/src/scraper/scrapeURL/index.ts  (lines 587–606)</text>

  <!-- highlight wash on length line -->
  <rect x="110" y="262" width="700" height="24" fill="#1f6feb" opacity="0.12"/>

  <!-- code lines -->
  <text x="134" y="206" class="mono" font-size="14.5" fill="#c9d1d9"><tspan fill="#ff7b72">const</tspan> is2xx = statusCode &gt;= <tspan fill="#79c0ff">200</tspan> &amp;&amp; statusCode &lt; <tspan fill="#79c0ff">300</tspan>;</text>
  <text x="134" y="234" class="mono" font-size="14.5" fill="#c9d1d9"><tspan fill="#ff7b72">const</tspan> hasNoPageError = engineResult.error === <tspan fill="#79c0ff">undefined</tspan>;</text>
  <text x="134" y="279" class="mono" font-size="14.5" fill="#c9d1d9"><tspan fill="#ff7b72">const</tspan> length = engineResult.html?.trim().length ?? <tspan fill="#79c0ff">0</tspan>;   <tspan fill="#3fb950">// ← crude quality check, already here</tspan></text>

  <!-- caption -->
  <text x="460" y="356" text-anchor="middle" font-size="14.5" fill="#1565a8">The pipeline already decides &#8220;is this engine result good enough&#8221; — but only with</text>
  <text x="460" y="376" text-anchor="middle" font-size="14.5" fill="#1565a8"><tspan class="mono" font-size="13.5">statusCode</tspan> + <tspan class="mono" font-size="13.5">length</tspan>. That&#8217;s the seam.</text>

  <!-- arrow down -->
  <line x1="460" y1="392" x2="460" y2="420" stroke="#9aa6b4" stroke-width="2.5"/>
  <path d="M 460 426 L 454 416 L 466 416 Z" fill="#9aa6b4"/>

  <!-- ============ ZONE 2 : THE UPGRADE (HERO) ============ -->
  <text x="460" y="452" text-anchor="middle" class="title" font-size="14" letter-spacing="1.5" fill="#8a96a4">THE UPGRADE</text>

  <g filter="url(#shadowSoft)">
    <rect x="160" y="466" width="600" height="240" rx="14" fill="#1565a8"/>
  </g>
  <!-- hero label -->
  <text x="460" y="506" text-anchor="middle" class="mono title" font-size="24" fill="#ffffff">quality(doc)</text>

  <!-- 5 pure heuristics -->
  <text x="460" y="536" text-anchor="middle" font-size="14" fill="#cfe2f3">5 pure heuristics</text>

  <!-- pill chips row -->
  <g class="mono" font-size="13" fill="#1565a8">
    <g filter="url(#shadow)"><rect x="206" y="550" width="74" height="28" rx="14" fill="#eaf2fb"/></g>
    <text x="243" y="569" text-anchor="middle">isEmpty</text>
    <g filter="url(#shadow)"><rect x="290" y="550" width="76" height="28" rx="14" fill="#eaf2fb"/></g>
    <text x="328" y="569" text-anchor="middle">garbled</text>
    <g filter="url(#shadow)"><rect x="376" y="550" width="110" height="28" rx="14" fill="#eaf2fb"/></g>
    <text x="431" y="569" text-anchor="middle">softBotWall</text>
    <g filter="url(#shadow)"><rect x="496" y="550" width="134" height="28" rx="14" fill="#eaf2fb"/></g>
    <text x="563" y="569" text-anchor="middle">boilerplateRatio</text>
    <g filter="url(#shadow)"><rect x="640" y="550" width="74" height="28" rx="14" fill="#eaf2fb"/></g>
    <text x="677" y="569" text-anchor="middle">jsShell</text>
  </g>

  <!-- amber focal badge -->
  <g filter="url(#shadowSoft)">
    <rect x="232" y="598" width="456" height="44" rx="10" fill="#e67e22"/>
  </g>
  <text x="460" y="626" text-anchor="middle" class="mono title" font-size="16.5" fill="#ffffff">2 files · ~120 lines · no deps · no LLM · no network</text>

  <!-- italic note -->
  <text x="460" y="668" text-anchor="middle" font-size="13.5" font-style="italic" fill="#dbe8f5">upgrades the existing <tspan class="mono" font-style="normal" font-size="12.5">length</tspan> check from &#8220;is it non-empty&#8221; → &#8220;is it actually good&#8221;</text>
  <text x="460" y="690" text-anchor="middle" class="mono" font-size="14" fill="#ffffff">→ returns doc.quality</text>

  <!-- fan-out -->
  <line x1="460" y1="706" x2="460" y2="724" stroke="#9aa6b4" stroke-width="2.5"/>
  <text x="460" y="744" text-anchor="middle" class="title" font-size="14" letter-spacing="1.5" fill="#8a96a4">ONE FIELD, THREE CONSUMERS</text>

  <!-- branch lines from center to three columns -->
  <path d="M 460 754 L 460 766 L 213 766 L 213 786" fill="none" stroke="#9aa6b4" stroke-width="2.5"/>
  <path d="M 460 766 L 460 786" fill="none" stroke="#9aa6b4" stroke-width="2.5"/>
  <path d="M 460 766 L 707 766 L 707 786" fill="none" stroke="#9aa6b4" stroke-width="2.5"/>
  <path d="M 213 792 L 207 782 L 219 782 Z" fill="#9aa6b4"/>
  <path d="M 460 792 L 454 782 L 466 782 Z" fill="#9aa6b4"/>
  <path d="M 707 792 L 701 782 L 713 782 Z" fill="#9aa6b4"/>

  <!-- ============ ZONE 3 : THREE CONSUMERS ============ -->
  <!-- box 1 : green LIVE -->
  <g filter="url(#shadow)">
    <rect x="106" y="792" width="214" height="222" rx="12" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  </g>
  <rect x="106" y="792" width="214" height="34" rx="12" fill="#166534"/>
  <rect x="106" y="810" width="214" height="16" fill="#166534"/>
  <text x="213" y="814" text-anchor="middle" class="title" font-size="11" letter-spacing="0.8" fill="#ffffff">SHIPS FIRST · LIVE</text>
  <text x="213" y="858" text-anchor="middle" class="mono" font-size="13" fill="#166534">scrape().quality</text>
  <text x="213" y="888" text-anchor="middle" font-size="13.5" fill="#2a3744">user-facing field —</text>
  <text x="213" y="908" text-anchor="middle" font-size="13.5" fill="#2a3744">self-serve the</text>
  <text x="213" y="928" text-anchor="middle" font-size="13.5" fill="#2a3744">silent-200</text>

  <!-- box 2 : green LIVE -->
  <g filter="url(#shadow)">
    <rect x="353" y="792" width="214" height="222" rx="12" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  </g>
  <rect x="353" y="792" width="214" height="34" rx="12" fill="#166534"/>
  <rect x="353" y="810" width="214" height="16" fill="#166534"/>
  <text x="460" y="814" text-anchor="middle" class="title" font-size="11" letter-spacing="0.8" fill="#ffffff">LIVE</text>
  <text x="460" y="852" text-anchor="middle" font-size="13.5" fill="#2a3744">engine-loop</text>
  <text x="460" y="872" text-anchor="middle" font-size="13.5" fill="#2a3744">termination — stop the</text>
  <text x="460" y="892" text-anchor="middle" font-size="13.5" fill="#2a3744">infinite waterfall</text>
  <text x="460" y="912" text-anchor="middle" font-size="13.5" fill="#2a3744">(<tspan class="mono" font-size="12.5">issue #2350</tspan>) when</text>
  <text x="460" y="932" text-anchor="middle" font-size="13.5" fill="#2a3744">quality won&#8217;t improve</text>

  <!-- box 3 : amber OFFLINE -->
  <g filter="url(#shadow)">
    <rect x="600" y="792" width="214" height="222" rx="12" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  </g>
  <rect x="600" y="792" width="214" height="34" rx="12" fill="#e67e22"/>
  <rect x="600" y="810" width="214" height="16" fill="#e67e22"/>
  <text x="707" y="814" text-anchor="middle" class="title" font-size="11" letter-spacing="0.8" fill="#ffffff">OFFLINE · LATER</text>
  <text x="707" y="854" text-anchor="middle" font-size="13.5" fill="#2a3744">feeds engpicker</text>
  <text x="707" y="874" text-anchor="middle" font-size="13.5" fill="#2a3744">calibration + the</text>
  <text x="707" y="894" text-anchor="middle" class="mono" font-size="12.5" fill="#2a3744">scrape-evals</text>
  <text x="707" y="912" text-anchor="middle" font-size="13.5" fill="#2a3744">CI</text>
  <text x="707" y="952" text-anchor="middle" font-size="11.5" font-style="italic" fill="#a85d18">offline consumers — talk to</text>
  <text x="707" y="968" text-anchor="middle" font-size="11.5" font-style="italic" fill="#a85d18">them, don&#8217;t block on them</text>

  <!-- ============ PUNCHLINE BAR ============ -->
  <g filter="url(#shadowSoft)">
    <rect x="160" y="1052" width="600" height="56" rx="12" fill="#0d1117"/>
  </g>
  <text x="460" y="1087" text-anchor="middle" class="title" font-size="19" fill="#ffffff">One insertion point. Additive. Nothing rewired.</text>
</svg>
