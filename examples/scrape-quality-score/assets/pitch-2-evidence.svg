  <!-- background -->
  <rect width="1000" height="940" fill="#f8f9fa"/>

  <!-- ===================== TITLE ===================== -->
  <text x="500" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#1c2733">The evidence — grievances &#8594; one primitive &#8594; a pile of stalled PRs</text>
  <text x="500" y="66" text-anchor="middle" font-size="13.5" fill="#5b6672">Real Firecrawl GitHub issues cluster into 5 cheap checks. Today they&#8217;re patched one site at a time, and the structural fixes can&#8217;t land.</text>

  <!-- column headers -->
  <text x="175" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a444f">THE GRIEVANCES</text>
  <text x="175" y="121" text-anchor="middle" font-size="11.5" fill="#7b8593">real GitHub issues</text>

  <text x="500" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1565a8">THE PRIMITIVE</text>
  <text x="500" y="121" text-anchor="middle" font-size="11.5" fill="#3d7bb5">quality(doc) — 5 heuristics</text>

  <text x="828" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a444f">HOW IT&#8217;S FIXED TODAY</text>
  <text x="828" y="121" text-anchor="middle" font-size="11.5" fill="#7b8593">reactive patches &amp; stalled reworks</text>

  <!-- ===================== LEFT COLUMN: grievance cards ===================== -->
  <!-- card geometry: x=40 w=270 ; rows centered to feed the primitive -->

  <!-- Card 1: Empty / silent 200 -->
  <g filter="url(#soft)">
    <rect x="40" y="146" width="270" height="76" rx="9" fill="#ffffff" stroke="#d4dae1" stroke-width="1"/>
    <rect x="40" y="146" width="5" height="76" rx="2.5" fill="#8a93a0"/>
  </g>
  <text x="58" y="170" font-size="13.5" font-weight="700" fill="#2b3540">Empty / silent 200</text>
  <text x="58" y="191" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#385<tspan fill="#9aa3ae">·7</tspan>  #1309<tspan fill="#9aa3ae">·14</tspan>  #2316<tspan fill="#9aa3ae"> open</tspan></text>
  <text x="58" y="210" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#684   #666</text>

  <!-- Card 2: Blocked / bot wall -->
  <g filter="url(#soft)">
    <rect x="40" y="234" width="270" height="76" rx="9" fill="#ffffff" stroke="#d4dae1" stroke-width="1"/>
    <rect x="40" y="234" width="5" height="76" rx="2.5" fill="#8a93a0"/>
  </g>
  <text x="58" y="258" font-size="13.5" font-weight="700" fill="#2b3540">Blocked / bot wall</text>
  <text x="58" y="279" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#2350<tspan fill="#9aa3ae">·25</tspan>  #495<tspan fill="#9aa3ae">·14</tspan>  #2257</text>
  <text x="58" y="298" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#2413 <tspan fill="#c0392b" font-style="italic">&#8220;still using credit&#8221;</tspan></text>

  <!-- Card 3: Boilerplate leaks -->
  <g filter="url(#soft)">
    <rect x="40" y="322" width="270" height="60" rx="9" fill="#ffffff" stroke="#d4dae1" stroke-width="1"/>
    <rect x="40" y="322" width="5" height="60" rx="2.5" fill="#8a93a0"/>
  </g>
  <text x="58" y="346" font-size="13.5" font-weight="700" fill="#2b3540">Boilerplate leaks</text>
  <text x="58" y="367" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#284<tspan fill="#9aa3ae">·9</tspan>  #1564  #1  #748</text>

  <!-- Card 4: Garbled / encoding -->
  <g filter="url(#soft)">
    <rect x="40" y="394" width="270" height="76" rx="9" fill="#ffffff" stroke="#d4dae1" stroke-width="1"/>
    <rect x="40" y="394" width="5" height="76" rx="2.5" fill="#8a93a0"/>
  </g>
  <text x="58" y="418" font-size="13.5" font-weight="700" fill="#2b3540">Garbled / encoding</text>
  <text x="58" y="439" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#547  #1142<tspan fill="#9aa3ae"> jp</tspan>  #1277<tspan fill="#9aa3ae"> gbk</tspan></text>
  <text x="58" y="458" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#306<tspan fill="#9aa3ae"> PDF</tspan>  #1153<tspan fill="#9aa3ae"> ePub</tspan></text>

  <!-- Card 5: JS-shell / dynamic -->
  <g filter="url(#soft)">
    <rect x="40" y="482" width="270" height="60" rx="9" fill="#ffffff" stroke="#d4dae1" stroke-width="1"/>
    <rect x="40" y="482" width="5" height="60" rx="2.5" fill="#8a93a0"/>
  </g>
  <text x="58" y="506" font-size="13.5" font-weight="700" fill="#2b3540">JS-shell / dynamic</text>
  <text x="58" y="527" font-size="11.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#46505b">#215  #2375  #1297</text>

  <!-- ===================== ARROWS  left clusters -> primitive ===================== -->
  <!-- primitive box: x=360 y=180 w=280 h=380 ; left edge x=360, vertical center ~370 -->
  <!-- each arrow targets the matching heuristic row inside the hero -->
  <path d="M310,184 C338,200 332,238 358,238" fill="none" stroke="#8a93a0" stroke-width="1.6" marker-end="url(#arrowGrey)"/>
  <path d="M310,272 C336,290 332,320 358,320" fill="none" stroke="#8a93a0" stroke-width="1.6" marker-end="url(#arrowGrey)"/>
  <path d="M310,352 C338,368 334,400 358,400" fill="none" stroke="#8a93a0" stroke-width="1.6" marker-end="url(#arrowGrey)"/>
  <path d="M310,432 C338,432 332,290 358,290" fill="none" stroke="#8a93a0" stroke-width="1.6" marker-end="url(#arrowGrey)"/>
  <path d="M310,512 C342,500 332,452 358,452" fill="none" stroke="#8a93a0" stroke-width="1.6" marker-end="url(#arrowGrey)"/>
  <text x="332" y="556" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9aa3ae">one primitive covers the whole cluster</text>

  <!-- ===================== MIDDLE: HERO primitive ===================== -->
  <g filter="url(#heroShadow)">
    <rect x="360" y="180" width="280" height="372" rx="14" fill="#ffffff" stroke="#1565a8" stroke-width="2.5"/>
  </g>
  <!-- hero header band -->
  <path d="M360,194 a14,14 0 0 1 14,-14 h252 a14,14 0 0 1 14,14 v34 h-280 z" fill="#1565a8"/>
  <text x="500" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="'SF Mono',Menlo,Consolas,monospace">quality(doc)</text>
  <text x="500" y="220" text-anchor="middle" font-size="10.5" fill="#cfe2f2">5 heuristics &#183; one function</text>

  <!-- heuristic rows -->
  <!-- isEmpty -->
  <text x="378" y="242" font-size="13" font-weight="700" fill="#1565a8" font-family="'SF Mono',Menlo,Consolas,monospace">isEmpty</text>
  <text x="378" y="258" font-size="10.5" fill="#5b6672">markdown length &#8776; 0</text>
  <line x1="378" y1="269" x2="622" y2="269" stroke="#e3e8ee" stroke-width="1"/>

  <!-- garbled -->
  <text x="378" y="288" font-size="13" font-weight="700" fill="#1565a8" font-family="'SF Mono',Menlo,Consolas,monospace">garbled</text>
  <text x="378" y="304" font-size="10.5" fill="#5b6672">replacement / control-char ratio, mojibake</text>
  <line x1="378" y1="315" x2="622" y2="315" stroke="#e3e8ee" stroke-width="1"/>

  <!-- softBotWall -->
  <text x="378" y="334" font-size="13" font-weight="700" fill="#1565a8" font-family="'SF Mono',Menlo,Consolas,monospace">softBotWall</text>
