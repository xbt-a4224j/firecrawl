  <text x="894" y="443" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#c0392b">#3213</text>
  <text x="894" y="458" text-anchor="middle" font-size="8.8" fill="#a04a40">handle empty, no 500</text>
  <text x="894" y="467" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c0392b">OPEN</text>

  <!-- duel double arrow -->
  <line x1="819" y1="448" x2="841" y2="448" stroke="#c0392b" stroke-width="2.4" marker-start="url(#duelStart)" marker-end="url(#duel)"/>

  <!-- #2381 huge failed rework -->
  <rect x="704" y="494" width="252" height="50" rx="8" fill="#ffffff" stroke="#e2a9a1" stroke-dasharray="5 3"/>
  <text x="716" y="514" font-size="12" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#7b3a33">#2381</text>
  <rect x="762" y="503" width="58" height="16" rx="8" fill="#fbeeec" stroke="#e2a9a1"/>
  <text x="791" y="515" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b">CLOSED</text>
