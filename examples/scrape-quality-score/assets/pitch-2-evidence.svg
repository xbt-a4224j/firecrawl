  <line x1="378" y1="361" x2="622" y2="361" stroke="#e3e8ee" stroke-width="1"/>

  <!-- boilerplateRatio -->
  <text x="378" y="380" font-size="13" font-weight="700" fill="#1565a8" font-family="'SF Mono',Menlo,Consolas,monospace">boilerplateRatio</text>
  <text x="378" y="396" font-size="10.5" fill="#5b6672">nav / footer &#247; content</text>
  <line x1="378" y1="407" x2="622" y2="407" stroke="#e3e8ee" stroke-width="1"/>

  <!-- jsShell -->
  <text x="378" y="426" font-size="13" font-weight="700" fill="#1565a8" font-family="'SF Mono',Menlo,Consolas,monospace">jsShell</text>
  <text x="378" y="442" font-size="10.5" fill="#5b6672">tiny markdown + large script-heavy html</text>

  <!-- tag chips -->
  <g font-size="10.5" font-weight="600">
    <rect x="378" y="466" width="46" height="20" rx="10" fill="#e8f1f9" stroke="#bcd6ec"/>
    <text x="401" y="480" text-anchor="middle" fill="#1565a8">pure</text>
    <rect x="430" y="466" width="52" height="20" rx="10" fill="#e8f1f9" stroke="#bcd6ec"/>
    <text x="456" y="480" text-anchor="middle" fill="#1565a8">~1ms</text>
    <rect x="488" y="466" width="62" height="20" rx="10" fill="#e8f1f9" stroke="#bcd6ec"/>
    <text x="519" y="480" text-anchor="middle" fill="#1565a8">no LLM</text>
    <rect x="556" y="466" width="70" height="20" rx="10" fill="#e8f1f9" stroke="#bcd6ec"/>
    <text x="591" y="480" text-anchor="middle" fill="#1565a8">~120 LOC</text>
  </g>
  <text x="500" y="512" text-anchor="middle" font-size="11" fill="#3d7bb5">deterministic signal every scrape can carry</text>
  <text x="500" y="534" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1565a8">&#8595;  what it would unblock  &#8595;</text>

  <!-- ===================== ARROWS primitive -> right column ===================== -->
  <!-- to merged group (top right) -->
  <path d="M640,330 C690,300 700,250 768,250" fill="none" stroke="#1565a8" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- to graveyard group (bottom right) -->
  <path d="M640,420 C700,470 700,560 768,560" fill="none" stroke="#1565a8" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ===================== RIGHT COLUMN ===================== -->
  <!-- TOP GROUP: merged / reactive -->
  <g filter="url(#soft)">
    <rect x="770" y="146" width="200" height="0" fill="none"/>
  </g>
  <rect x="690" y="146" width="280" height="186" rx="11" fill="#f1f8f2" stroke="#9ccaa6" stroke-width="1.5"/>
  <rect x="690" y="146" width="280" height="30" rx="11" fill="#166534"/>
  <rect x="690" y="160" width="280" height="16" fill="#166534"/>
  <text x="704" y="166" font-size="12.5" font-weight="700" fill="#ffffff">MERGED &#8212; but reactive, one site per PR</text>

  <g font-size="11.5">
    <text x="704" y="198" font-family="'SF Mono',Menlo,Consolas,monospace" font-weight="700" fill="#166534">#275</text>
    <text x="748" y="198" fill="#3a444f"><tspan font-family="'SF Mono',Menlo,Consolas,monospace">removeTags</tspan> — manual config</text>

    <text x="704" y="222" font-family="'SF Mono',Menlo,Consolas,monospace" font-weight="700" fill="#166534">#239</text>
    <text x="748" y="222" fill="#3a444f">scroll-xpath &#8220;for readme docs&#8221;</text>
    <text x="748" y="237" font-size="10" fill="#7b8593">one site class</text>

    <text x="704" y="261" font-family="'SF Mono',Menlo,Consolas,monospace" font-weight="700" fill="#166534">#1221</text>
    <text x="752" y="261" fill="#3a444f">charset re-decode</text>
    <text x="752" y="276" font-size="10" fill="#7b8593">triggered by one Japanese page</text>

    <text x="704" y="300" font-family="'SF Mono',Menlo,Consolas,monospace" font-weight="700" fill="#166534">#318</text>
    <text x="748" y="300" fill="#3a444f">regex for google-drive PDFs <tspan font-family="'SF Mono',Menlo,Consolas,monospace" fill="#7b8593">(+1/&#8722;1)</tspan></text>
  </g>
  <text x="704" y="324" font-size="11" font-style="italic" fill="#166534">whack-a-mole — patches one manifestation at a time</text>

  <!-- BOTTOM GROUP: unmerged graveyard -->
  <rect x="690" y="356" width="280" height="320" rx="11" fill="#fbeeec" stroke="#e2a9a1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="690" y="356" width="280" height="30" rx="11" fill="#c0392b"/>
  <rect x="690" y="370" width="280" height="16" fill="#c0392b"/>
  <text x="704" y="376" font-size="12.5" font-weight="700" fill="#ffffff">UNMERGED &#8212; the systemic ones can&#8217;t land</text>

  <!-- tombstone watermark -->
  <g opacity="0.10" fill="#c0392b">
    <path d="M905,470 a28,30 0 0 1 56,0 v64 h-56 z"/>
    <rect x="893" y="534" width="80" height="14" rx="3"/>
  </g>

  <!-- DUELING PRs — emphasized -->
  <rect x="704" y="398" width="252" height="84" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="830" y="416" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b" letter-spacing="0.5">DUELING — BOTH OPEN, NEITHER MERGED</text>

  <!-- left PR -->
  <rect x="716" y="426" width="100" height="44" rx="7" fill="#fbeeec" stroke="#e2a9a1"/>
  <text x="766" y="443" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#c0392b">#2347</text>
  <text x="766" y="458" text-anchor="middle" font-size="8.8" fill="#a04a40">return 200 for empty</text>
  <text x="766" y="467" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c0392b">OPEN</text>

