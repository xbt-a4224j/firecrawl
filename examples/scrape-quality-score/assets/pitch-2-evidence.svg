  <text x="884" y="514" text-anchor="middle" font-size="11.5" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#c0392b">+1642</text>
  <text x="884" y="533" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#a04a40">30 files</text>

  <!-- #2358 / #2364 loop bandaids -->
  <rect x="704" y="556" width="252" height="46" rx="8" fill="#ffffff" stroke="#e2a9a1" stroke-dasharray="5 3"/>
  <text x="716" y="576" font-size="12" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#7b3a33">#2358 &#183; #2364</text>
  <text x="716" y="593" font-size="10.5" fill="#7b3a33">retry-loop bandaids</text>
  <rect x="864" y="565" width="80" height="16" rx="8" fill="#fbeeec" stroke="#e2a9a1"/>
  <text x="904" y="577" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b">closed / open</text>

  <!-- red label -->
  <text x="830" y="626" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b">no quality signal to gate on &#8594; these stall</text>
  <text x="830" y="646" text-anchor="middle" font-size="10.5" font-style="italic" fill="#a04a40">every structural fix argues about &#8220;is this page actually bad?&#8221;</text>
  <text x="830" y="664" text-anchor="middle" font-size="10.5" font-style="italic" fill="#a04a40">— the exact question quality(doc) answers</text>

  <!-- ===================== PUNCHLINE BANNER ===================== -->
  <rect x="40" y="700" width="920" height="200" rx="14" fill="#0f2a44"/>
  <rect x="40" y="700" width="6" height="200" rx="3" fill="#1565a8"/>
  <text x="500" y="752" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">One ~120-line primitive covers the whole grievance cluster</text>
  <text x="500" y="780" text-anchor="middle" font-size="17" font-weight="700" fill="#7fb4e0">— and gives the stalled PRs the signal they&#8217;re missing.</text>

  <!-- mini recap row inside banner -->
  <g font-size="12">
    <circle cx="250" cy="828" r="6" fill="#8a93a0"/>
    <text x="266" y="832" fill="#cdd6e0">5 grievance clusters</text>
    <text x="408" y="832" fill="#6f7d8c">&#8594;</text>
    <circle cx="430" cy="828" r="6" fill="#1565a8"/>
    <text x="446" y="832" fill="#cdd6e0">1 deterministic signal</text>
    <text x="612" y="832" fill="#6f7d8c">&#8594;</text>
