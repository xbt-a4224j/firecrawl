  <rect x="232" y="36" width="120" height="34" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="292" y="57" text-anchor="middle" fill="#b91c1c" font-family="ui-monospace, monospace">success: true</text>
  <rect x="402" y="36" width="248" height="34" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="526" y="57" text-anchor="middle" fill="#b91c1c">silently wrong data downstream</text>
