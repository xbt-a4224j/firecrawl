<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="ui-sans-serif, system-ui" font-size="13">
  <defs><marker id="az" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#94a3b8"/></marker></defs>
  <text x="0" y="16" fill="#334155" font-weight="600">Zoom — the accept / reject decision</text>

  <rect x="200" y="30" width="160" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="280" y="51" text-anchor="middle" fill="#334155" font-family="ui-monospace, monospace">extracted markdown</text>
  <path d="M280 62 V78" stroke="#94a3b8" fill="none" marker-end="url(#az)"/>

  <rect x="210" y="80" width="140" height="38" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="280" y="104" text-anchor="middle" fill="#9a3412" font-family="ui-monospace, monospace">length &gt; 0 ?</text>
  <path d="M350 99 H418" stroke="#94a3b8" fill="none" marker-end="url(#az)"/>
  <text x="384" y="93" text-anchor="middle" fill="#64748b" font-size="11">no</text>
  <rect x="420" y="80" width="138" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="489" y="104" text-anchor="middle" fill="#15803d">reject &#8594; next engine</text>

  <path d="M280 118 V148" stroke="#94a3b8" fill="none" marker-end="url(#az)"/>
  <text x="292" y="138" fill="#64748b" font-size="11">yes</text>

  <rect x="186" y="150" width="188" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="4 3"/>
  <text x="280" y="167" text-anchor="middle" fill="#1d4ed8" font-size="12">silent-failure signature?</text>
  <text x="280" y="183" text-anchor="middle" fill="#1d4ed8" font-size="11">(this test exists only when the flag is on)</text>
  <path d="M374 170 H418" stroke="#94a3b8" fill="none" marker-end="url(#az)"/>
  <text x="396" y="164" text-anchor="middle" fill="#64748b" font-size="11">match</text>
  <rect x="420" y="151" width="138" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="489" y="175" text-anchor="middle" fill="#15803d">reject &#8594; next engine</text>

  <path d="M280 190 V220" stroke="#94a3b8" fill="none" marker-end="url(#az)"/>
  <text x="296" y="210" fill="#64748b" font-size="11">none</text>
  <rect x="200" y="222" width="160" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="280" y="246" text-anchor="middle" fill="#15803d" font-family="ui-monospace, monospace">accept · success: true</text>

  <text x="0" y="286" fill="#b91c1c" font-size="11">flag off: the signature test is skipped, so length &gt; 0 alone accepts — a captcha page included.</text>
</svg>
